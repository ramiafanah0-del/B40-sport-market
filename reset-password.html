<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>B40 sport | إعادة تعيين كلمة المرور</title>

  <meta name="description" content="إعادة تعيين كلمة المرور - B40 sport">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --black: #080808;
      --dark: #111111;
      --orange: #ff6a00;
      --orange-light: #ff8a2b;
      --white: #ffffff;
      --gray: #a7a7a7;
      --card: #151515;
      --success: #4ade80;
      --danger: #ef4444;
      --warning: #ff8a2b;
    }

    body {
      font-family: "Cairo", sans-serif;
      background: var(--black);
      color: var(--white);
      line-height: 1.7;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font-family: inherit;
      cursor: pointer;
    }

    /* ===== RESET PASSWORD PAGE ===== */

    .reset-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 15% 50%, rgba(255, 106, 0, 0.18), transparent 35%),
        linear-gradient(135deg, #080808 0%, #111111 100%);
      padding: 20px;
    }

    .reset-container {
      width: 100%;
      max-width: 400px;
      background: var(--card);
      border: 1px solid #242424;
      border-radius: 20px;
      padding: 40px;
    }

    .reset-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .reset-logo {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .reset-logo span {
      color: var(--orange);
    }

    .reset-subtitle {
      color: var(--gray);
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 14px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 15px;
      background: #111111;
      border: 1px solid #242424;
      border-radius: 10px;
      color: var(--white);
      font-family: inherit;
      font-size: 14px;
      transition: 0.2s;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--orange);
      box-shadow: 0 0 0 3px rgba(255, 106, 0, 0.1);
    }

    .form-group input:disabled {
      background: #0a0a0a;
      opacity: 0.6;
      cursor: not-allowed;
    }

    .reset-button {
      width: 100%;
      padding: 12px;
      background: var(--orange);
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 16px;
      transition: 0.25s;
      margin-top: 10px;
    }

    .reset-button:hover:not(:disabled) {
      background: var(--orange-light);
      transform: translateY(-2px);
    }

    .reset-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .form-error {
      color: var(--danger);
      font-size: 13px;
      margin-top: 8px;
      display: none;
    }

    .form-error.show {
      display: block;
    }

    /* ===== ALERT ===== */

    .alert {
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      display: none;
      font-weight: 600;
      font-size: 14px;
    }

    .alert.show {
      display: block;
    }

    .alert-success {
      background: rgba(74, 222, 128, 0.1);
      color: var(--success);
      border: 1px solid rgba(74, 222, 128, 0.3);
    }

    .alert-error {
      background: rgba(239, 68, 68, 0.1);
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .alert-info {
      background: rgba(59, 130, 246, 0.1);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.3);
    }

    /* ===== SUCCESS STATE ===== */

    .success-container {
      text-align: center;
      display: none;
    }

    .success-container.show {
      display: block;
    }

    .success-icon {
      font-size: 60px;
      color: var(--success);
      margin-bottom: 20px;
    }

    .success-title {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 15px;
    }

    .success-message {
      color: var(--gray);
      margin-bottom: 30px;
      font-size: 14px;
    }

    .back-button {
      width: 100%;
      padding: 12px;
      background: var(--orange);
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 16px;
      transition: 0.25s;
      cursor: pointer;
    }

    .back-button:hover {
      background: var(--orange-light);
      transform: translateY(-2px);
    }

    /* ===== LOADING STATE ===== */

    .loading {
      display: inline-block;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    /* ===== RESPONSIVE ===== */

    @media (max-width: 480px) {
      .reset-container {
        padding: 30px 20px;
      }

      .reset-logo {
        font-size: 24px;
      }

      .form-group input,
      .reset-button,
      .back-button {
        font-size: 14px;
        padding: 10px 12px;
      }
    }
  </style>
</head>

<body>

  <div class="reset-page">
    <div class="reset-container">
      <div class="reset-header">
        <div class="reset-logo">
          <span>B40</span> sport
        </div>
        <p class="reset-subtitle">إعادة تعيين كلمة المرور</p>
      </div>

      <div id="alert" class="alert"></div>

      <!-- RESET FORM -->
      <div id="resetForm" class="reset-form">
        <form id="passwordForm">
          <div class="form-group">
            <label for="newPassword">كلمة المرور الجديدة</label>
            <input type="password" id="newPassword" name="newPassword" required minlength="8" autocomplete="new-password">
            <div class="form-error" id="newPasswordError"></div>
          </div>

          <div class="form-group">
            <label for="confirmPassword">تأكيد كلمة المرور</label>
            <input type="password" id="confirmPassword" name="confirmPassword" required minlength="8" autocomplete="new-password">
            <div class="form-error" id="confirmPasswordError"></div>
          </div>

          <button type="submit" class="reset-button" id="resetBtn">تغيير كلمة المرور</button>
        </form>
      </div>

      <!-- SUCCESS STATE -->
      <div id="successState" class="success-container">
        <div class="success-icon">✓</div>
        <div class="success-title">تم تغيير كلمة المرور بنجاح</div>
        <p class="success-message">يمكنك الآن تسجيل الدخول باستخدام كلمة المرور الجديدة</p>
        <button class="back-button" id="backButton">العودة إلى تسجيل الدخول</button>
      </div>
    </div>
  </div>

  <!-- Supabase Integration -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ========== CONFIGURATION ==========

    const SUPABASE_URL = 'https://ftjeunoetgxmtllfzqah.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_TQcjs7QYCPPUTqADYJKMAg_mjhJzKqX';
    
    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    // ========== DOM ELEMENTS ==========

    const passwordForm = document.getElementById('passwordForm');
    const resetBtn = document.getElementById('resetBtn');
    const newPasswordInput = document.getElementById('newPassword');
    const confirmPasswordInput = document.getElementById('confirmPassword');
    const newPasswordError = document.getElementById('newPasswordError');
    const confirmPasswordError = document.getElementById('confirmPasswordError');
    const alert = document.getElementById('alert');
    const resetFormDiv = document.getElementById('resetForm');
    const successState = document.getElementById('successState');
    const backButton = document.getElementById('backButton');

    // ========== STATE ==========

    let hasValidToken = false;

    // ========== INITIALIZATION ==========

    async function init() {
      try {
        // Check if there's an existing session (recovery link creates one)
        const { data: { session }, error: sessionError } = await supabaseClient.auth.getSession();

        if (sessionError) {
          console.error('Session check error:', sessionError);
          showAlert('خطأ في الاتصال. يرجى تحديث الصفحة', 'error');
          resetBtn.disabled = true;
          return;
        }

        if (session && session.user) {
          // Valid session exists - user can change password
          hasValidToken = true;
          showAlert('', '');
          resetBtn.disabled = false;
          console.log('Recovery session verified for user:', session.user.id);
        } else {
          // No valid session
          showAlert('رابط إعادة التعيين غير صحيح أو انتهت صلاحيته. يرجى طلب رابط جديد', 'error');
          resetBtn.disabled = true;
        }
      } catch (err) {
        console.error('Initialization error:', err);
        showAlert('حدث خطأ ما. يرجى تحديث الصفحة', 'error');
        resetBtn.disabled = true;
      }
    }

    // ========== PASSWORD VALIDATION ==========

    function validatePasswords() {
      const errors = [];
      const newPassword = newPasswordInput.value.trim();
      const confirmPassword = confirmPasswordInput.value.trim();

      // Clear previous errors
      newPasswordError.classList.remove('show');
      confirmPasswordError.classList.remove('show');

      // Validate new password
      if (!newPassword) {
        errors.push({ field: 'newPassword', message: 'كلمة المرور الجديدة مطلوبة' });
      } else if (newPassword.length < 8) {
        errors.push({ field: 'newPassword', message: 'يجب أن تكون كلمة المرور 8 أحرف على الأقل' });
      }

      // Validate confirm password
      if (!confirmPassword) {
        errors.push({ field: 'confirmPassword', message: 'تأكيد كلمة المرور مطلوب' });
      }

      // Check if passwords match
      if (newPassword && confirmPassword && newPassword !== confirmPassword) {
        errors.push({ field: 'confirmPassword', message: 'كلمات المرور غير متطابقة' });
      }

      // Display errors
      errors.forEach(err => {
        if (err.field === 'newPassword') {
          newPasswordError.textContent = err.message;
          newPasswordError.classList.add('show');
        } else if (err.field === 'confirmPassword') {
          confirmPasswordError.textContent = err.message;
          confirmPasswordError.classList.add('show');
        }
      });

      return errors.length === 0;
    }

    // ========== ALERT FUNCTIONS ==========

    function showAlert(message, type) {
      if (!message) {
        alert.classList.remove('show', 'alert-success', 'alert-error', 'alert-info');
        alert.textContent = '';
        return;
      }

      alert.textContent = message;
      alert.classList.add('show');

      if (type === 'success') {
        alert.classList.add('alert-success');
        alert.classList.remove('alert-error', 'alert-info');
      } else if (type === 'error') {
        alert.classList.add('alert-error');
        alert.classList.remove('alert-success', 'alert-info');
      } else if (type === 'info') {
        alert.classList.add('alert-info');
        alert.classList.remove('alert-success', 'alert-error');
      }
    }

    // ========== FORM SUBMISSION ==========

    passwordForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      if (!hasValidToken) {
        showAlert('جلسة غير صحيحة. يرجى طلب رابط إعادة تعيين جديد', 'error');
        return;
      }

      // Clear previous errors and alerts
      newPasswordError.classList.remove('show');
      confirmPasswordError.classList.remove('show');
      showAlert('', '');

      // Validate
      if (!validatePasswords()) {
        return;
      }

      const newPassword = newPasswordInput.value.trim();

      try {
        resetBtn.disabled = true;
        resetBtn.innerHTML = '<span class="loading">⏳</span>';

        // Update password using the current session
        const { data, error } = await supabaseClient.auth.updateUser({
          password: newPassword
        });

        if (error) {
          console.error('Password update error:', error);
          resetBtn.disabled = false;
          resetBtn.textContent = 'تغيير كلمة المرور';

          if (error.message.includes('session')) {
            showAlert('انتهت صلاحية الجلسة. يرجى طلب رابط إعادة تعيين جديد', 'error');
            hasValidToken = false;
          } else if (error.message.includes('password')) {
            showAlert('كلمة المرور غير صحيحة أو ضعيفة جدًا', 'error');
          } else {
            showAlert('فشل تغيير كلمة المرور: ' + error.message, 'error');
          }
        } else {
          // Success
          showAlert('', '');
          resetFormDiv.style.display = 'none';
          successState.classList.add('show');

          // Sign out user after successful password reset
          setTimeout(async () => {
            await supabaseClient.auth.signOut();
          }, 1000);
        }
      } catch (err) {
        console.error('Unexpected error:', err);
        showAlert('حدث خطأ ما. يرجى المحاولة لاحقًا', 'error');
        resetBtn.disabled = false;
        resetBtn.textContent = 'تغيير كلمة المرور';
      }
    });

    // ========== BACK BUTTON ==========

    backButton.addEventListener('click', () => {
      // Redirect to login page
      window.location.href = 'admin.html';
    });

    // ========== START ==========

    window.addEventListener('load', init);
  </script>

</body>

</html>
